{% extends "GiangVien/Home.html" %}
{% block content %}
<script src="https://cdn.tailwindcss.com"></script>

<div class="fixed inset-0 bg-black/40 flex items-center justify-center">

<div class="bg-white rounded-xl shadow w-[700px] p-6">

<h2 class="text-lg font-semibold mb-4">
Thêm sinh viên vào hội đồng
</h2>

<form method="POST">
{% csrf_token %}

<div class="max-h-[400px] overflow-y-auto">

{% for sv in sinhviens %}
<label class="flex items-center gap-3 border-b py-2">
<input type="checkbox" name="sinh_vien" value="{{sv.ma_sv}}">
<div>
<b>{{sv.ho_ten}}</b><br>
<span class="text-gray-400 text-sm">{{sv.lop}}</span>
</div>
</label>
{% endfor %}

</div>

<div class="flex justify-end gap-3 mt-4">
<button class="px-4 py-2 border rounded">Hủy</button>
<button class="bg-blue-600 text-white px-4 py-2 rounded">
Thêm vào hội đồng
</button>
</div>

</form>

</div>
</div>
{% endblock %}
