<!--    </div>-->
</div>

        <!-- Thành viên Hội đồng -->
        <div class="bg-white p-6 rounded-xl shadow mb-8">
            <label class="block text-sm font-medium text-gray-700 mb-3">
                Thành viên Hội đồng <span class="text-red-500">*</span>
            </label>
            <select id="select-gv" name="giang_vien" multiple="multiple" style="width: 100%;" required>
                {% for gv in giangviens %}
                    <option value="{{ gv.ma_gv }}">{{ gv.ho_ten }} ({{ gv.ma_gv }})</option>
                {% endfor %}
            </select>
            <p id="error-gv" class="text-red-500 text-sm hidden mt-2">❌ Phải chọn ít nhất 2 giảng viên</p>
            <p id="error-gvhd" class="text-red-500 text-sm hidden mt-2">❌ Không được chọn GVHD của sinh viên vào cùng hội đồng</p>
        </div>

        <!-- Danh sách sinh viên -->
        <div class="bg-white p-6 rounded-xl shadow">
            <div class="flex justify-between items-center mb-4">

                <button type="button" onclick="openPopup()"
                        class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-lg flex items-center gap-2">
                    + Thêm sinh viên

                        <th class="text-left py-3">GVHD</th>

            </table>

        <input type="hidden" name="sinh_vien_ids" id="sv-hidden">

</div>

<!-- Popup -->
<div id="popup" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center z-50">
    <div class="bg-white w-[680px] rounded-2xl p-6 max-h-[90vh] flex flex-col">
        <h2 class="font-bold text-xl mb-4">Chọn sinh viên</h2>
        <input id="search" placeholder="Tìm theo mã SV hoặc họ tên..."
               class="border w-full p-3 rounded-lg mb-4 focus:border-blue-500 outline-none">
        <div id="list-sv" class="flex-1 overflow-y-auto"></div>
        <div class="flex justify-end mt-6">
            <button onclick="closePopup()"
                    class="px-6 py-3 text-gray-600 hover:bg-gray-100 rounded-lg">Đóng</button>
        </div>
    </div>
</div>

<script>
// Khởi tạo Select2 và DataTable
$(document).ready(function() {
    $('#select-gv').select2({
        placeholder: "Chọn giảng viên (ít nhất 2 người)",
        allowClear: true,
        width: '100%'
    });

    // DataTable
    window.table = $('#sv-table').DataTable({
    pageLength: 10,
    searching: false,
    ordering: true,
    language: {
        emptyTable: "Chưa có sinh viên nào được chọn",

        // 🔥 DÒNG NÀY CHÍNH LÀ "Showing ..."
        info: "Hiển thị _START_ - _END_ / _TOTAL_ sinh viên",

        // 🔥 KHI KHÔNG CÓ DỮ LIỆU
        infoEmpty: "Hiển thị 0 - 0 / 0 sinh viên",

        // 🔥 "Show 10 entries"
        lengthMenu: "Hiển thị _MENU_ sinh viên",

        // 🔥 Previous / Next
        paginate: {
            previous: "←",
            next: "→"
        }
    }
});

    // Load danh sách sinh viên ban đầu (khi chưa chọn GV nào)
    loadAvailableStudents();
});

// Khi thay đổi giảng viên → lọc sinh viên hợp lệ
$('#select-gv').on('change', function() {
    loadAvailableStudents();
});

let selectedSV = [];

// Load sinh viên hợp lệ (đã lọc theo GV đã chọn)
function loadAvailableStudents() {
    let selectedGVs = $('#select-gv').val() || [];

    fetch(`/giang-vien/hoi-dong/load-sv/?gvs=${selectedGVs.join(',')}`)
        .then(res => res.json())
        .then(data => {
            let html = "";
            if (data.length === 0) {
                html = '<p class="text-center text-gray-400 py-12">Không còn sinh viên nào phù hợp.<br>Tất cả sinh viên của GV đã chọn đều bị loại.</p>';
            } else {
                data.forEach(sv => {
                    html += `
                        <div class="flex justify-between items-center p-3 border-b hover:bg-gray-50 group">
                            <div>
                                <span class="font-medium">${sv.ten}</span>
                                <span class="text-gray-500 text-sm ml-2">(${sv.id} - ${sv.lop})</span>
                                <span class="ml-3 text-xs bg-amber-100 text-amber-700 px-2 py-1 rounded">
                                    GVHD: ${sv.gvhd || 'Chưa phân công'}
                                </span>
                            </div>
                            <button onclick="addSV('${sv.id}','${sv.ten.replace(/'/g, "\\'")}','${sv.lop}','${sv.gvhd}')"
                                    class="bg-blue-600 text-white text-sm px-5 py-1.5 rounded-lg opacity-0 group-hover:opacity-100 transition">
                                Chọn
                            </button>
                        </div>`;
                });
            }
            document.getElementById("list-sv").innerHTML = html || '<p class="text-center text-gray-400 py-12">Không còn sinh viên nào để thêm</p>';
        })
        .catch(() => {
            document.getElementById("list-sv").innerHTML = '<p class="text-red-500 text-center py-8">Lỗi khi tải danh sách sinh viên</p>';
        });
}

function openPopup(){
    $("#popup").removeClass("hidden");
}

function closePopup(){
    $("#popup").addClass("hidden");
}

function addSV(id, ten, lop, gvhd){
    if(selectedSV.find(x => x.id === id)) return;
    selectedSV.push({id, ten, lop, gvhd});
    renderTable();
}

function removeSV(id){
    selectedSV = selectedSV.filter(x => x.id !== id);
    renderTable();
}

function renderTable(){
    window.table.clear();
    selectedSV.forEach(sv => {
        window.table.row.add([
            sv.id,
            sv.ten,
            sv.lop,
            sv.gvhd || '<span class="text-amber-600">Chưa phân</span>',
            `<button onclick="removeSV('${sv.id}')" class="text-red-600 hover:text-red-800 text-2xl leading-none">×</button>`
        ]);
    });
    window.table.draw();
    document.getElementById("sv-hidden").value = selectedSV.map(x => x.id).join(",");
}

// Validate trước khi submit
document.getElementById("form-hoi-dong").addEventListener("submit", function(e){
    let selectedGv = $('#select-gv').val() || [];

    if(selectedGv.length < 2){
        e.preventDefault();
        $("#error-gv").removeClass("hidden");
        return false;
    }
    $("#error-gv").addClass("hidden");

    let conflict = selectedSV.some(sv => selectedGv.includes(sv.gvhd));
    if(conflict){
        e.preventDefault();
        $("#error-gvhd").removeClass("hidden");
        return false;
    } else {
        $("#error-gvhd").addClass("hidden");
    }
});
</script>

{% endblock %}
