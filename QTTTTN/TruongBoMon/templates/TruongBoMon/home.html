{% load static %}
<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MIS – Trưởng Bộ Môn{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'TruongBoMon/css/home.css' %}">
    {% block extra_css %}{% endblock %}
</head>

<body>
    <aside class="sidebar">
        <div class="sidebar-logo">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M22 10v6M2 10l10-5 10 5-10 5z" />
                    <path d="M6 12v5c3 3 9 3 12 0v-5" />
                </svg>
            </div>
            <span class="logo-text">MIS</span>
        </div>

        <nav class="sidebar-nav">
            <a href="{% url 'TruongBoMon:truongboomon_home' %}" class="nav-item {% if current_page == 'home' %}active{% endif %}">
                <span class="nav-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                        <circle cx="8.5" cy="7" r="4" />
                        <circle cx="18" cy="11" r="3" />
                        <path d="M20.5 13.5L22 15" />
                    </svg>
                </span>
                <span class="nav-label">Sinh viên của tôi</span>
            </a>
            <a href="#" class="nav-item {% if current_page == 'hoi_dong_bv' %}active{% endif %}">
                <span class="nav-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                        <circle cx="9" cy="7" r="4" />
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                        <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                    </svg>
                </span>
                <span class="nav-label">Hội đồng bảo vệ</span>
            </a>
            <a href="{% url 'TruongBoMon:phan_cong_gvpt' %}" class="nav-item {% if current_page == 'phan_cong_gvpt' %}active{% endif %}">
                <span class="nav-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="4" width="18" height="16" rx="2" />
                        <circle cx="12" cy="10" r="3" />
                        <path d="M7 16c0-1.5 2-2.5 5-2.5s5 1 5 2.5" />
                    </svg>
                </span>
                <span class="nav-label">Phân công GVPT</span>
            </a>
            <a href="#" class="nav-item {% if current_page == 'duyet_gvhd' %}active{% endif %}">
                <span class="nav-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                        <polyline points="9 11 11 13 15 9" />
                    </svg>
                </span>
                <span class="nav-label">Duyệt GVHD</span>
            </a>
            <a href="#" class="nav-item {% if current_page == 'duyet_hoi_dong' %}active{% endif %}">
                <span class="nav-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="7" x2="15" y2="7" />
                        <line x1="3" y1="17" x2="15" y2="17" />
                        <polyline points="18 5 20 7 24 3" />
                        <line x1="18" y1="15" x2="24" y2="21" />
                        <line x1="24" y1="15" x2="18" y2="21" />
                    </svg>
                </span>
                <span class="nav-label">Duyệt hội đồng</span>
            </a>
        </nav>

        <div class="sidebar-user">
            <div class="user-avatar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                    <circle cx="12" cy="7" r="4" />
                </svg>
            </div>
            <div class="user-info">
                <span class="user-name">{{ user.get_full_name|default:user.username }}</span>
                <span class="user-role">Trưởng Bộ Môn</span>
            </div>
            <a href="{% url 'logout' %}" class="logout-btn" title="Đăng xuất">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                    <polyline points="16 17 21 12 16 7" />
                    <line x1="21" y1="12" x2="9" y2="12" />
                </svg>
            </a>
        </div>
    </aside>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>
</body>

</html>
